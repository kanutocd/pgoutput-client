services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pgoutput_client_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PGOUTPUT_CLIENT_E2E_PORT:-55432}:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_worker_processes=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pgoutput_client_test"]
      interval: 1s
      timeout: 5s
      retries: 30
